<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="陈昭宇（Zhaoyu Chen）的个人学术主页，介绍研究方向、论文、工作论文与公共传播。" />
    <title>陈昭宇 | Zhaoyu Chen</title>
    <link rel="stylesheet" href="style.css" />
    <link id="theme-style" rel="stylesheet" />
  </head>
  <body>
    <header class="site-header"><div class="container nav-wrap">
      <a class="brand" href="index.html">陈昭宇 <span>| Zhaoyu Chen</span></a>
      <nav aria-label="主导航">
        <a class="active" href="index.html"><span class="lang-zh">首页</span><span class="lang-en">Home</span></a>
        <a href="research.html"><span class="lang-zh">研究</span><span class="lang-en">Research</span></a>
        <a href="#honors"><span class="lang-zh">荣誉</span><span class="lang-en">Honors</span></a>
        <a href="#contact"><span class="lang-zh">联系</span><span class="lang-en">Contact</span></a>
        <button class="language-toggle" id="language-toggle" type="button" aria-label="切换为英文">EN</button>
      </nav>
    </div></header>
    <main class="container" id="site-main"></main>
    <footer class="container footer"><span>© 2026 陈昭宇 · Zhaoyu Chen</span><span>Built with HTML &amp; CSS · GitHub Pages</span></footer>
    <script src="content.js"></script>
    <script>
      const languageToggle = document.getElementById("language-toggle");
      let savedLanguage = "en";
      try { savedLanguage = localStorage.getItem("site-language") || "en"; } catch (error) {}
      function setLanguage(language) {
        const isEnglish = language === "en";
        document.body.classList.toggle("is-en", isEnglish);
        document.documentElement.lang = isEnglish ? "en" : "zh-CN";
        document.title = isEnglish ? "Zhaoyu Chen | Personal Homepage" : "陈昭宇 | Zhaoyu Chen";
        languageToggle.textContent = isEnglish ? "中" : "EN";
        languageToggle.setAttribute("aria-label", isEnglish ? "切换为中文" : "Switch to Chinese");
        try { localStorage.setItem("site-language", language); } catch (error) {}
      }
      languageToggle.addEventListener("click", () => setLanguage(document.body.classList.contains("is-en") ? "zh" : "en"));
      setLanguage(savedLanguage);
      const requestedTheme = new URLSearchParams(window.location.search).get("theme");
      const privatePreview = window.location.hostname === "" || ["localhost", "127.0.0.1"].includes(window.location.hostname);
      const theme = privatePreview && requestedTheme === "minimal" ? "minimal" : "photo-cream";
      const themeStyle = document.getElementById("theme-style");
      if (theme === "minimal") { themeStyle.href = "style-minimal.css"; document.body.classList.add("theme-minimal"); } else { themeStyle.href = "style-photo-cream.css"; document.body.classList.add("theme-photo-cream"); }
      document.querySelectorAll('a[href^="research.html"]').forEach((link) => { const [path, hash] = link.getAttribute("href").split("#"); link.href = `${path}${privatePreview ? `?theme=${theme}` : ""}${hash ? `#${hash}` : ""}`; });
    </script>
  </body>
</html>
